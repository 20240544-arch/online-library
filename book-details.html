<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details - Online Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    
    <div class="card book-details-wrapper">
        
        <div class="details-flex">
            
            <div class="details-img-col">
                <img src="https://cdn.kobo.com/book-images/3e6fed76-068d-43f4-8128-9408c0444285/1200/1200/False/the-prisoner-of-zenda-115.jpg" alt="The Prisoner of Zenda Book Cover" title="The Prisoner of Zenda by Anthony Hope" class="cover-img">
            </div>
            
            
            <div class="details-text-col">
                <h1 class="details-title">The Prisoner of Zenda</h1>
                
        
                <div>
                    <span class="badge badge-available">Available</span>
                </div>
                
               
                <p class="book-author">Author: Anthony Hope</p>
                <p class="book-category">Category: Classic Literature</p>
                <p class="book-description">
                    A gripping tale of adventure and political intrigue where an English gentleman on holiday in Ruritania must impersonate the King to thwart a coup.
                </p>

               
                <div class="details-actions">
                    <button class="btn btn-primary">Borrow This Book</button>
                    <button class="btn btn-secondary">Back to Catalogue</button>
                </div>
            </div>
        </div>
        
    </div>
</div>
</body>
</html>
