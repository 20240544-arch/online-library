<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria Digital Library | Login</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color, #f8fafc);
            margin: 0;
            font-family: inherit;
        }

        .login-box {
            display: flex;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: #ffffff;
            border-radius: var(--radius, 12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color, #e2e8f0);
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .role-selection {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            color: #475569;
            font-size: 15px;
            font-weight: 500;
        }

        .role-selection label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box .input-field {
            width: 100%;
            height: 50px;
            font-size: 15px;
            padding: 0 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box .input-field:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .forgot section {
            display: flex;
            align-items: center;
            color: #475569;
        }

        #check {
            margin-right: 8px;
            cursor: pointer;
        }

        .forgot a {
            color: #1e3a8a;
            text-decoration: none;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            background: #1e3a8a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #172554;
        }

        .sign-up-link, .guest-link {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            color: #475569;
        }

        .sign-up-link a, .guest-link a {
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
        }

        .sign-up-link a:hover, .guest-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="login-header">
            <h2>Login</h2>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="role-selection">
                <label>
                    <input type="radio" name="role" value="user" checked> User
                </label>
                <label>
                    <input type="radio" name="role" value="admin"> Admin
                </label>
            </div>

            <div class="input-box">
                <input type="email" class="input-field" placeholder="Email" autocomplete="off" required />
            </div>

            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password" autocomplete="off" required />
            </div>

            <div class="forgot">
                <section>
                    <input type="checkbox" id="check" />
                    <label for="check" style="cursor: pointer;">Remember Me</label>
                </section>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <div class="sign-up-link">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>

        <div class="guest-link">
            <p><a href="index.html">&larr; Back to Home</a></p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            
            
            if (selectedRole === 'admin') {
                window.location.href = 'admin-books.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>

</body>
</html>
