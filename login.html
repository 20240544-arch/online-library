<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria Digital Library | Login</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .login-box {
            display: flex;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: #ffffff;
            border-radius: var(--radius, 12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color, #e2e8f0);
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box .input-field {
            width: 100%;
            height: 50px;
            font-size: 15px;
            padding: 0 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box .input-field:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        /* :valid / :invalid styling (shown after the user visits a field or tries to submit) */
        .input-box .input-field.touched:valid,
        .was-submitted .input-box .input-field:valid {
            border-color: #16a34a;
        }

        .input-box .input-field.touched:invalid,
        .was-submitted .input-box .input-field:invalid {
            border-color: #dc2626;
        }

        .forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .forgot section {
            display: flex;
            align-items: center;
            color: #475569;
        }

        #check {
            margin-right: 8px;
            cursor: pointer;
        }

        .forgot label {
            cursor: pointer;
        }

        .forgot a {
            color: #1e3a8a;
            text-decoration: none;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            background: #1e3a8a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #172554;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .sign-up-link,
        .guest-link {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            color: #475569;
        }

        .sign-up-link a,
        .guest-link a {
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
        }

        .sign-up-link a:hover,
        .guest-link a:hover {
            text-decoration: underline;
        }

        .form-message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14.4px;
            font-weight: 600;
        }

        .form-message-error {
            background: #fee2e2;
            color: #dc2626;
        }

        .form-message-success {
            background: #dcfce7;
            color: #16a34a;
        }
    </style>
</head>

<body>

    <!-- Navbar is built by nav.js from the session role -->
    <header class="navbar" id="navbar"></header>

    <main class="auth-main">
        <div class="login-box">
            <div class="login-header">
                <h2>Login</h2>
            </div>

            <p id="form-message" class="form-message" role="alert" hidden></p>

            <form id="login-form">
                <div class="input-box">
                    <input type="text" id="username" name="username" class="input-field" placeholder="Username"
                        autocomplete="username" required>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" class="input-field" placeholder="Password"
                        autocomplete="current-password" required>
                </div>

                <div class="forgot">
                    <section>
                        <input type="checkbox" id="check" />
                        <label for="check">Remember Me</label>
                    </section>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn" id="submit">Sign In</button>
            </form>

            <div class="sign-up-link">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>

            <div class="guest-link">
                <p><a href="index.html">&larr; Back to Home</a></p>
            </div>
        </div>
    </main>

    <script src="js/storage.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/nav.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/login.js" defer></script>
</body>

</html>
