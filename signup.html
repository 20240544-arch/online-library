<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria Digital Library | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color, #f8fafc);
            margin: 0;
            font-family: inherit;
        }

        .signup-box {
            display: flex;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: #ffffff;
            border-radius: var(--radius, 12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color, #e2e8f0);
            box-sizing: border-box;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .signup-header h2 {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box .input-field {
            width: 100%;
            height: 50px;
            font-size: 15px;
            padding: 0 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box .input-field:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            background: #1e3a8a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #172554;
        }

        .login-link, .guest-link {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            color: #475569;
        }

        .login-link a, .guest-link a {
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover, .guest-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-box">
        <div class="signup-header">
            <h2>Create Account</h2>
        </div>

        <form onsubmit="handleSignup(event)">
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Full Name" autocomplete="off" required />
            </div>

            <div class="input-box">
                <input type="email" class="input-field" placeholder="Email Address" autocomplete="off" required />
            </div>

            <div class="input-box">
                <input type="password" id="password" class="input-field" placeholder="Password" autocomplete="off" required />
            </div>

            <div class="input-box">
                <input type="password" id="confirm-password" class="input-field" placeholder="Confirm Password" autocomplete="off" required />
            </div>

            <button type="submit" class="submit-btn">Sign Up</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>

        <div class="guest-link">
            <p><a href="index.html">&larr; Back to Home</a></p>
        </div>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

           
            alert("Account created successfully!");
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
