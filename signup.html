<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <title>Login</title>


</head>





<body>


    <div class="signup-box">
        <div class="signup-header">
            <header>Sign up</header>
        </div>
        <div class="input-box">
            <input type="text" class="input-field" placeholder="Email" autocomplete="off" required />
        </div>
        <div class="input-box">
            <input type="password" class="input-field" placeholder="Password" autocomplete="off" required />
        </div>
        <div class="input-submit">
            <button class="submit-btn" id="submit" onclick="window.location.href='index.html';"></button>
            <label for="submit">Sign In</label>
        </div>
        <div class="login-link">
            <p style="color: #1e3a8a">Already have an account ? <a style="color: #1e3a8a" href=login.html>Login</a></p>

        </div>
    </div>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh
        }

        .signup-box {
            display: flex;
            justify-content: center;
            flex-direction: column;
            width: 440px;
            height: 480px;
            padding: 30px;
        }

        .signup-header {
            text-align: center;
            margin: 20px 0 40px 0;
        }

            .signup-header header {
                color: #1e3a8a;
                font-size: 30px;
                font-weight: 600;
            }

        .input-box .input-field {
            width: 100%;
            height: 60px;
            font-size: 17px;
            padding: 0 25px;
            margin-bottom: 15px;
            border-radius: 30px;
            border: none;
            box-shadow: 0px 5px 10px 1px rgba(0,0,0,0.05);
            outline: none;
            transition: .3s;
        }

        ::placeholder {
            font-weight: 500;
            color: #1e3a8a;
        }

        .input-field:focus {
            width: 105%;
        }

        .forgot {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        section {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #1e3a8a;
        }

        #check {
            margin-right: 10px;
        }

        a {
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }

        section a {
            color: #1e3a8a;
        }

        .input-submit {
            position: relative;
        }

        .submit-btn {
            width: 100%;
            height: 60px;
            background: #1e3a8a;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-submit label {
            position: absolute;
            top: 45%;
            left: 50%;
            color: #fff;
            -webkit-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #172554;
            transform: scale(1.5,1);
        }

        .sign-up-link {
            text-align: center;
            font-size: 15px;
            margin-top: 20px;
        }

            .sign-up-link a {
                color: #1e3a8a;
                font-weight: 600;
            }
    </style>

  

</body>
</html>
